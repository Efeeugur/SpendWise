name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Create Secrets.xcconfig
      run: |
        echo "// CI placeholder config" > Secrets.xcconfig
        echo "SUPABASE_URL = https://placeholder.supabase.co" >> Secrets.xcconfig
        echo "SUPABASE_ANON_KEY = placeholder_key" >> Secrets.xcconfig
    
    - name: Build
      run: |
        xcodebuild build \
          -scheme SpendWise \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty || true
    
    - name: Test
      run: |
        xcodebuild test \
          -scheme SpendWise \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO \
          -resultBundlePath TestResults \
          | xcpretty || true
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults.xcresult
        retention-days: 7
